<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE 11-MONTH RUN</title>
<style>
  @font-face {
    font-family: "BrandFont";
    src: url("TUPAHRG_.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
  }

  body {
    font-family: "BrandFont", sans-serif;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 16:9 stage centered on screen */
  #stage {
    position: relative;
    background: #000000;
    color: #ffffff;
    overflow: hidden;
    /* Fit a 16:9 box inside the viewport */
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
  }

  #content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4%;
  }

  /* Title */
  #title {
    font-size: 62px;
    line-height: 1.05;
    text-align: center;
    letter-spacing: 0.04em;
    margin-bottom: 56px;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.9s ease, transform 0.9s ease;
    white-space: nowrap;
  }
  #title.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* Stats */
  #stats {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .stat {
    display: flex;
    align-items: baseline;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .stat.show {
    opacity: 1;
    transform: translateY(0);
  }

  .stat .num {
    width: 110px;
    text-align: right;
    font-size: 40px;
    line-height: 1;
    flex: 0 0 auto;
  }

  .stat .label {
    margin-left: 26px;
    font-size: 30px;
    line-height: 1;
    letter-spacing: 0.32em;
  }

  /* Play / Replay button overlay */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000000;
    cursor: pointer;
    z-index: 10;
  }
  .overlay.hidden {
    display: none;
  }

  .btn {
    width: 110px;
    height: 110px;
    border: 3px solid #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .overlay:hover .btn {
    transform: scale(1.06);
    background: rgba(255, 255, 255, 0.08);
  }

  /* Play triangle */
  .btn .triangle {
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 22px 0 22px 38px;
    border-color: transparent transparent transparent #ffffff;
    margin-left: 8px;
  }

  /* Replay label */
  #replayOverlay .btn {
    width: auto;
    height: auto;
    border-radius: 40px;
    padding: 18px 34px;
    font-size: 24px;
    letter-spacing: 0.2em;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="content">
      <div id="title">THE 11-MONTH RUN</div>
      <div id="stats">
        <div class="stat" data-target="150">
          <span class="num">0</span>
          <span class="label">SONGS RECORDED</span>
        </div>
        <div class="stat" data-target="3">
          <span class="num">0</span>
          <span class="label">MOVIES FILMED</span>
        </div>
        <div class="stat" data-target="2">
          <span class="num">0</span>
          <span class="label">ALBUMS RELEASED</span>
        </div>
        <div class="stat" data-target="2">
          <span class="num">0</span>
          <span class="label">CONTINENTS TOURED</span>
        </div>
      </div>
    </div>

    <!-- Play overlay -->
    <div class="overlay" id="playOverlay">
      <div class="btn"><div class="triangle"></div></div>
    </div>

    <!-- Replay overlay -->
    <div class="overlay hidden" id="replayOverlay">
      <div class="btn">REPLAY</div>
    </div>
  </div>

<script>
  (function () {
    var title = document.getElementById("title");
    var stats = Array.prototype.slice.call(document.querySelectorAll(".stat"));
    var playOverlay = document.getElementById("playOverlay");
    var replayOverlay = document.getElementById("replayOverlay");

    var timers = [];

    function clearTimers() {
      timers.forEach(function (t) { clearTimeout(t); });
      timers = [];
    }

    function later(fn, ms) {
      timers.push(setTimeout(fn, ms));
    }

    // Ease-out cubic
    function easeOut(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function countUp(el, target, duration) {
      var start = null;
      function frame(ts) {
        if (start === null) start = ts;
        var p = Math.min((ts - start) / duration, 1);
        var val = Math.round(easeOut(p) * target);
        el.textContent = val;
        if (p < 1) {
          requestAnimationFrame(frame);
        } else {
          el.textContent = target;
        }
      }
      requestAnimationFrame(frame);
    }

    function reset() {
      clearTimers();
      title.classList.remove("show");
      stats.forEach(function (s) {
        s.classList.remove("show");
        s.querySelector(".num").textContent = "0";
      });
    }

    function play() {
      reset();
      playOverlay.classList.add("hidden");
      replayOverlay.classList.add("hidden");

      // Timeline (~9s total)
      // Title fades in at 0.4s
      later(function () { title.classList.add("show"); }, 400);

      // Stats fade in one by one, each counts up
      var statStart = 1600;   // first stat begins
      var statGap = 1500;     // spacing between stats
      var countDuration = 1300;

      stats.forEach(function (stat, i) {
        var at = statStart + i * statGap;
        later(function () {
          stat.classList.add("show");
          var num = stat.querySelector(".num");
          var target = parseInt(stat.getAttribute("data-target"), 10);
          countUp(num, target, countDuration);
        }, at);
      });

      // Final stat finishes ~ statStart + 3*gap + countDuration
      var endTime = statStart + (stats.length - 1) * statGap + countDuration;
      // = 1600 + 4500 + 1300 = 7400ms

      // Hold final frame 1.8s, then show replay
      later(function () {
        replayOverlay.classList.remove("hidden");
      }, endTime + 1800);
    }

    playOverlay.addEventListener("click", play);
    replayOverlay.addEventListener("click", play);
  })();
</script>
</body>
</html>
